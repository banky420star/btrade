# RL Configuration
environment:
  symbol: XAUUSD
  timeframe: 1h
  lookback: 50
  features:
    - close
    - volume
    - rsi
    - macd
    - atr
  action_space: 3  # hold, buy, sell
  reward_function: sharpe_ratio

model:
  type: ddqn
  architecture:
    hidden_layers: [128, 64, 32]
    activation: relu
    dropout: 0.2
  training:
    epochs: 10
    batch_size: 32
    learning_rate: 0.001
    gamma: 0.99
    epsilon_start: 1.0
    epsilon_end: 0.01
    epsilon_decay: 0.995
    target_update_freq: 100
    replay_buffer_size: 10000
    prioritized_replay: true
    alpha: 0.6
    beta: 0.4

training:
  episodes: 1000
  max_steps_per_episode: 1000
  validation_freq: 100
  save_freq: 50
  checkpoint_dir: models/registry/rl_checkpoints

inference:
  epsilon: 0.0  # greedy
  noise_floor: 0.01
  update_frequency: 60  # seconds